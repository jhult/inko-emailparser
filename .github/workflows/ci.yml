---
name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  license-check:
    name: License Header Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check License Headers
        uses: apache/skywalking-eyes/header@main
        with:
          config: .licenserc.yaml

  check-and-test:
    name: Check and Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/inko-lang/inko:main
    needs: [license-check]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check Formatting and Run Tests
        run: |
          inko --version
          inko fmt --check
          inko test

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/inko-lang/inko:main
    needs: [license-check, check-and-test]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check Inko version
        run: |
          inko --version

      - name: Run Performance Benchmarks
        continue-on-error: true
        run: |
          echo "Running performance benchmarks (informational only)..."
          ./run_benchmarks.sh || echo "Benchmarks completed with issues"

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: benchmarks/results/benchmark-*.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: '200%'
          comment-on-alert: true
          alert-comment-cc-users: '@jhult'
          fail-on-alert: true
          max-items-in-chart: 25
