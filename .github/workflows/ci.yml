---
name: CI

on:
  workflow_dispatch:
  push:
    branches: [trunk]
    paths:
      - "**/*.inko"
      - ".github/workflows/**"
  pull_request:
    branches: [trunk]
    paths:
      - "**/*.inko"
      - ".github/workflows/**"

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  license-check:
    name: License Header Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check License Headers
        uses: apache/skywalking-eyes/header@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0
        with:
          config: .licenserc.yaml

  check-and-test:
    name: Check and Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/inko-lang/inko@sha256:fa5aad694709c95e7e9abe3fd290f71ec62f1b4e2b230fad8b56b6b64617052e
    needs: [license-check]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Formatting and Run Tests
        run: |
          inko --version
          inko fmt --check
          inko test --release

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    # The benchmark action posts a commit summary on trunk pushes
    permissions:
      contents: write
    container:
      image: ghcr.io/inko-lang/inko@sha256:fa5aad694709c95e7e9abe3fd290f71ec62f1b4e2b230fad8b56b6b64617052e
    needs: [license-check, check-and-test]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fix git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check Inko version
        run: |
          inko --version

      - name: Run Performance Benchmarks
        continue-on-error: true
        run: |
          echo "Running performance benchmarks (informational only)..."
          ./test/benchmark/benchmark.sh --json || echo "Benchmarks completed with issues"

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
        with:
          tool: "customSmallerIsBetter"
          output-file-path: test/benchmark/results/benchmark-latest.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: "200%"
          comment-on-alert: ${{ github.event.pull_request.head.repo.fork == false }}
          summary-always: true
          alert-comment-cc-users: "@jhult"
          fail-on-alert: true
          max-items-in-chart: 25
