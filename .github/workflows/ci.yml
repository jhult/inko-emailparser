---
name: CI

on:
  workflow_dispatch:
  push:
    branches: [trunk]
    paths:
      - "**/*.inko"
      - ".github/workflows/**"
  pull_request:
    branches: [trunk]
    paths:
      - "**/*.inko"
      - ".github/workflows/**"

permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  license-check:
    name: License Header Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check License Headers
        uses: apache/skywalking-eyes/header@main
        with:
          config: .licenserc.yaml

  check-and-test:
    name: Check and Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/inko-lang/inko@sha256:8a3a8c8364ffbc245c8753dc7533a3611ddc8280f1ad23ced686de1cb613e362
    needs: [license-check]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check Formatting and Run Tests
        run: |
          inko --version
          inko fmt --check
          inko test

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/inko-lang/inko@sha256:8a3a8c8364ffbc245c8753dc7533a3611ddc8280f1ad23ced686de1cb613e362
    needs: [license-check, check-and-test]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Fix git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check Inko version
        run: |
          inko --version

      - name: Run Performance Benchmarks
        continue-on-error: true
        run: |
          echo "Running performance benchmarks (informational only)..."
          ./run_benchmarks.sh || echo "Benchmarks completed with issues"

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@a60cea5bc7b49e15c1f58f411161f99e0df48372 # v1.22.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
        with:
          tool: "customSmallerIsBetter"
          output-file-path: benchmarks/results/benchmark-latest.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: "200%"
          comment-on-alert: ${{ github.event.pull_request.head.repo.fork == false }}
          summary-always: true
          alert-comment-cc-users: "@jhult"
          fail-on-alert: true
          max-items-in-chart: 25
